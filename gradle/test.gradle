buildscript {
    ext {
        awaitilityVersion = '4.1.0'
        testContainersVersion = '2.0.5'
        restAssuredVersion = '5.5.7'
        spockVersion = '2.4-M7-groovy-4.0'
        groovyVersion = '4.0.32'
        archutnitVersion = '0.20.1'
        cglibVersion = '3.3.0'
        pactGenVersion = '1.4.0'
    }
}

sourceSets {
    test.groovy.srcDirs(
        "src/test/unit",
        "src/test/integration",
        "src/test/functional"
    )
}

idea {
    module {
        test
    }
}

test {
    useJUnitPlatform()
}
